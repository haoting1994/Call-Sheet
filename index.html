<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>CALL SHEET — 拍攝通告單 2026</title>
<style>
:root {
  --bg:        #f4f6fa;
  --bg2:       #ffffff;
  --bg3:       #f8f9fc;
  --bg4:       #eef1f7;
  --border:    #dde3f0;
  --border2:   #c4cfea;
  --text:      #0f1a2e;
  --text2:     #3d5278;
  --text3:     #7a8fab;
  --accent:    #1a56db;
  --accent2:   #1040b0;
  --accent-glow: rgba(26,86,219,0.12);
  --green:     #0a7a3e;
  --green-bg:  #e6f5ed;
  --amber:     #92600a;
  --amber-bg:  #fef6e4;
  --purple:    #5b21b6;
  --purple-bg: #ede9fe;
  --red:       #c0180c;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; min-height: 100vh;
  font-family: -apple-system, 'PingFang TC', 'Heiti TC', sans-serif;
  background: #dde3f0; font-size: 15px;
}

/* PC frame */
@media (min-width: 600px) {
  body { display: flex; align-items: flex-start; justify-content: center; padding: 32px 0 60px; background: #cdd3e0; }
  #app-root { width: 390px; min-height: 100vh; background: var(--bg); border-radius: 16px; overflow: hidden; box-shadow: 0 8px 48px rgba(26,86,219,0.15); position: relative; }
  #lock-screen { position: absolute; border-radius: 16px; }
  #loading { position: absolute; border-radius: 16px; }
  .modal-backdrop { position: fixed; }
  #pc-banner { display: flex !important; }
}
@media (max-width: 599px) {
  #app-root { min-height: 100vh; background: var(--bg); }
  #pc-banner { display: none !important; }
}

/* PC BANNER */
#pc-banner {
  display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 8888;
  background: var(--accent); color: #fff;
  align-items: center; justify-content: center; gap: 16px;
  padding: 10px 20px; font-size: 13px;
}
#pc-banner a {
  color: #fff; text-decoration: none; font-weight: 600;
  border: 1px solid rgba(255,255,255,0.5); border-radius: 6px; padding: 4px 12px;
}

/* LOCK */
#lock-screen {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, #e8eef8 0%, #f4f6fa 50%, #eaf0fb 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px;
}
#lock-screen.hidden { display: none; }
.lock-box {
  width: 100%; max-width: 320px;
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 16px; padding: 32px 28px;
  box-shadow: 0 8px 32px rgba(26,86,219,0.10);
}
.lock-logo { font-size: 10px; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
.lock-title { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.1; margin-bottom: 4px; letter-spacing: -0.02em; }
.lock-sub { font-size: 12px; color: var(--text3); margin-bottom: 28px; }
.lock-icon { font-size: 36px; margin-bottom: 20px; text-align: center; }
.lock-form { width: 100%; }
.lock-form input {
  width: 100%; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 13px 16px; font-size: 16px; color: var(--text);
  outline: none; margin-bottom: 10px; font-family: inherit; text-align: center;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.lock-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); background: #fff; }
.lock-btn {
  width: 100%; background: var(--accent); border: none; border-radius: 10px;
  padding: 14px; font-size: 15px; font-weight: 700; color: #fff;
  cursor: pointer; transition: background 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 8px rgba(26,86,219,0.25);
}
.lock-btn:active { background: var(--accent2); }
.lock-error { color: var(--red); font-size: 12px; text-align: center; margin-top: 10px; min-height: 18px; }

/* SCREENS */
.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* HOME */
#home { background: var(--bg); }
.home-hero {
  background: #fff;
  border-bottom: 1.5px solid var(--border);
  border-top: 3px solid var(--accent);
  padding: max(env(safe-area-inset-top), 48px) 20px 18px;
  box-shadow: 0 2px 8px rgba(26,86,219,0.05);
  flex-shrink: 0;
}
.home-hero-label {
  font-size: 12px; letter-spacing: 0.18em; color: var(--accent);
  font-weight: 700; margin-bottom: 4px; font-family: 'SF Mono', monospace;
}
.home-hero-title { font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; line-height: 1.1; }
.home-hero-sub { font-size: 12px; color: var(--text3); margin-top: 6px; }
.sync-badge {
  font-size: 10px; padding: 2px 8px; border-radius: 3px;
  background: var(--green-bg); color: var(--green);
  border: 1px solid rgba(10,122,62,0.2);
}
.sync-badge.syncing { background: var(--amber-bg); color: var(--amber); border-color: rgba(146,96,10,0.2); }

.home-body { padding: 16px; flex: 1; padding-bottom: max(env(safe-area-inset-bottom), 32px); }

/* DATE TABS */
.date-tabs-wrap { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
.date-tabs-wrap::-webkit-scrollbar { display: none; }
.date-tab {
  flex-shrink: 0; background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: 99px; padding: 7px 16px; font-size: 13px; font-weight: 500;
  color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.date-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.add-date-btn {
  flex-shrink: 0; background: var(--bg2); border: 1.5px dashed var(--border2);
  border-radius: 99px; padding: 6px 14px; font-size: 13px; color: var(--text3); cursor: pointer;
}

/* VENDOR CARDS */
.vendor-card {
  background: var(--bg2); border-radius: 12px; padding: 13px 14px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px;
  border: 1.5px solid var(--border);
  cursor: pointer; transition: all 0.15s; position: relative;
}
.vendor-card:active { transform: scale(0.98); border-color: var(--accent); }
.time-badge {
  background: #eef3ff; border: 1.5px solid var(--border2);
  border-radius: 8px; padding: 7px 9px; text-align: center; min-width: 56px; flex-shrink: 0;
  font-family: 'SF Mono', monospace;
}
.time-start { font-size: 14px; font-weight: 700; color: var(--accent); }
.time-end { font-size: 10px; color: var(--text3); margin-top: 1px; }
.vendor-card.active .time-badge, .vendor-card:active .time-badge {
  background: var(--accent); border-color: var(--accent);
}
.vendor-card.active .time-start, .vendor-card:active .time-start { color: #fff; }
.vendor-card.active .time-end, .vendor-card:active .time-end { color: rgba(255,255,255,0.7); }
.vendor-info { flex: 1; min-width: 0; }
.vendor-name { font-size: 15px; font-weight: 600; color: var(--text); }
.vendor-sub { font-size: 12px; color: var(--text3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badges { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.badge-interview { background: var(--green-bg); color: var(--green); border: 1px solid rgba(10,122,62,0.2); }
.badge-reel { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(146,96,10,0.2); }
.badge-exclusive { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(91,33,182,0.2); }
.card-arrow { color: var(--border2); font-size: 20px; flex-shrink: 0; }

.add-vendor-btn {
  width: 100%; background: var(--bg2); border: 1.5px dashed var(--border2);
  border-radius: 12px; padding: 14px;
  font-size: 14px; color: var(--text3); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px;
  transition: all 0.15s;
}
.add-vendor-btn:active { border-color: var(--accent); color: var(--accent); }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }

/* LOADING */
.loading-overlay {
  position: fixed; inset: 0; background: rgba(244,246,250,0.92); z-index: 500;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
}
.loading-overlay.hidden { display: none; }
.spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text2); }

/* DETAIL */
#detail { background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.detail-nav {
  background: var(--bg2); border-bottom: 1.5px solid var(--border);
  padding: max(env(safe-area-inset-top), 48px) 16px 12px;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0; position: sticky; top: 0; z-index: 10;
  box-shadow: 0 1px 4px rgba(26,86,219,0.06);
}
.back-btn {
  width: 36px; height: 36px; background: var(--bg4); border: 1.5px solid var(--border);
  border-radius: 50%; color: var(--text2); font-size: 20px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  transition: all 0.15s;
}
.back-btn:active { background: var(--accent); color: #fff; border-color: var(--accent); }
.detail-nav-title { font-size: 16px; font-weight: 700; color: var(--text); }
.detail-nav-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }

.detail-hero {
  background: var(--bg2); border-bottom: 1.5px solid var(--border);
  border-top: 3px solid var(--accent);
  padding: 16px 18px 18px; flex-shrink: 0;
}
.detail-time-text { font-size: 11px; color: var(--accent); margin-bottom: 4px; font-family: 'SF Mono', monospace; letter-spacing: 0.06em; }
.detail-vendor-big { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
.detail-company-text { font-size: 12px; color: var(--text3); margin-top: 4px; }

/* TAB BAR */
.tab-bar {
  background: var(--bg2); display: flex; border-bottom: 1.5px solid var(--border);
  position: sticky; top: 88px; z-index: 9; flex-shrink: 0;
  overflow-x: auto;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 1; border: none; background: none; padding: 12px 0;
  font-size: 13px; font-weight: 500; color: var(--text3);
  cursor: pointer; border-bottom: 2.5px solid transparent; transition: all 0.15s;
  white-space: nowrap; min-width: 0; padding: 12px 10px;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.detail-body { padding: 14px; padding-bottom: max(env(safe-area-inset-bottom), 32px); }

/* INFO CARD */
.info-card {
  background: var(--bg2); border-radius: 12px; margin-bottom: 12px;
  overflow: hidden; border: 1.5px solid var(--border);
  box-shadow: 0 1px 4px rgba(26,86,219,0.05);
}
.info-card-header {
  padding: 10px 14px; font-size: 11px; font-weight: 700; color: var(--accent);
  letter-spacing: 0.1em; border-bottom: 1px solid var(--border);
  font-family: 'SF Mono', monospace; text-transform: uppercase;
  background: #f0f4ff;
}
.info-row { display: flex; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid var(--border); gap: 12px; }
.info-row:last-child { border-bottom: none; }
.info-key { font-size: 11px; color: var(--text3); min-width: 56px; flex-shrink: 0; padding-top: 2px; font-family: 'SF Mono', monospace; }
.info-val { font-size: 14px; color: var(--text); line-height: 1.6; flex: 1; }

/* PRODUCT CARD */
.product-section-label { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; margin: 4px 0 10px; font-family: 'SF Mono', monospace; text-transform: uppercase; }
.product-card { background: var(--bg2); border-radius: 12px; margin-bottom: 10px; overflow: hidden; border: 1.5px solid var(--border); box-shadow: 0 1px 4px rgba(26,86,219,0.04); }
.product-card-top { padding: 10px 14px 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #f0f4ff; }
.product-card-title { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 0.08em; font-family: 'SF Mono', monospace; }
.product-img-zone { background: var(--bg4); width: 100%; aspect-ratio: 16 / 5; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
.product-img-zone img { width: 100%; height: 100%; object-fit: contain; }
.img-placeholder { text-align: center; }
.img-placeholder-icon { font-size: 32px; color: var(--border2); }
.img-placeholder-text { font-size: 12px; color: var(--text3); margin-top: 6px; }
.img-uploading { font-size: 12px; color: var(--text2); }
.product-text { padding: 12px 14px; font-size: 14px; color: var(--text2); line-height: 1.7; }

/* QA */
.qa-panel { padding: 14px; padding-bottom: max(env(safe-area-inset-bottom), 32px); }
.qa-card { background: var(--bg2); border-radius: 12px; margin-bottom: 10px; overflow: hidden; border: 1.5px solid var(--border); box-shadow: 0 1px 4px rgba(26,86,219,0.04); }
.qa-item { padding: 11px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.qa-item:last-child { border-bottom: none; }
.qa-num { width: 22px; height: 22px; background: var(--accent); color: #fff; border-radius: 4px; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; font-family: 'SF Mono', monospace; }
.qa-text { font-size: 14px; color: var(--text); line-height: 1.6; flex: 1; }
.delete-btn { background: none; border: none; color: var(--border2); font-size: 18px; cursor: pointer; padding: 0 4px; flex-shrink: 0; }
.qa-add-btn { width: 100%; background: var(--bg3); border: 1.5px dashed var(--border); border-radius: 10px; padding: 12px; font-size: 13px; color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }

/* HIGHLIGHT */
.highlight-panel { padding: 14px; padding-bottom: max(env(safe-area-inset-bottom), 32px); }
.highlight-card { background: var(--bg2); border-radius: 12px; margin-bottom: 10px; overflow: hidden; border: 1.5px solid var(--border); }
.highlight-card-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: #f0f4ff; }
.highlight-card-title { font-size: 14px; font-weight: 600; color: var(--text); }
.highlight-delete-btn { background: none; border: none; font-size: 12px; color: var(--text3); cursor: pointer; }
.highlight-body { padding: 12px 14px; }
.highlight-text { font-size: 14px; color: var(--text2); line-height: 1.7; white-space: pre-wrap; }
.highlight-add-btn { width: 100%; background: var(--bg3); border: 1.5px dashed var(--border); border-radius: 10px; padding: 14px; font-size: 14px; color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

/* PRODUCT IMG actions — hidden by default, revealed on tap (mobile has no hover) */
.img-actions {
  position: absolute; bottom: 0; left: 0; right: 0; display: flex;
  opacity: 0; pointer-events: none; transition: opacity 0.15s;
}
.product-img-zone.show-actions .img-actions { opacity: 1; pointer-events: auto; }
.img-action-btn { flex: 1; background: rgba(26,86,219,0.75); border: none; color: #fff; padding: 10px 0; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
.img-action-btn:not(:last-child) { border-right: 1px solid rgba(255,255,255,0.2); }
.img-tap-hint {
  position: absolute; top: 6px; right: 6px; z-index: 2;
  background: rgba(17,20,24,0.55); color: #fff; font-size: 11px;
  padding: 4px 8px; border-radius: 12px; pointer-events: none;
  transition: opacity 0.15s;
}
.product-img-zone.show-actions .img-tap-hint { opacity: 0; }
.product-img-zone:not(.has-img) .img-tap-hint { display: none; }

/* CAPTION */
.product-caption-wrap { padding: 7px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; background: var(--bg3); }
.product-caption-label { font-size: 11px; color: var(--text3); flex-shrink: 0; }
.product-caption-input { flex: 1; border: none; background: transparent; font-size: 13px; color: var(--text2); font-family: inherit; outline: none; }
.caption-save-btn { background: var(--accent); border: none; color: #fff; border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; flex-shrink: 0; display: none; }
.floorplan-zone { position: relative; background: var(--bg4); overflow: hidden; min-height: 100px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-bottom: 1px solid var(--border); }

/* MODAL */
.modal-backdrop { position: fixed; inset: 0; background: rgba(13,26,46,0.4); z-index: 100; display: none; align-items: flex-end; }
.modal-backdrop.open { display: flex; }
.modal { background: var(--bg2); border-radius: 20px 20px 0 0; width: 100%; padding: 20px 20px max(env(safe-area-inset-bottom), 24px); max-height: 90vh; overflow-y: auto; border-top: 1.5px solid var(--border); box-shadow: 0 -8px 32px rgba(26,86,219,0.12); }
.modal-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
.modal label { font-size: 11px; font-weight: 600; color: var(--text3); display: block; margin-bottom: 5px; margin-top: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-family: 'SF Mono', monospace; }
.modal input, .modal textarea { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg3); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
.modal input:focus, .modal textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); background: #fff; }
.modal textarea { resize: none; min-height: 80px; }
.modal-row { display: flex; gap: 10px; }
.modal-row > div { flex: 1; }
.modal-btns { display: flex; gap: 10px; margin-top: 18px; }
.btn-cancel { flex: 1; background: var(--bg4); border: 1.5px solid var(--border); border-radius: 12px; padding: 13px; font-size: 15px; color: var(--text2); cursor: pointer; font-family: inherit; }
.btn-confirm { flex: 2; background: var(--accent); border: none; border-radius: 12px; padding: 13px; font-size: 15px; color: #fff; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 2px 8px rgba(26,86,219,0.25); }
.btn-confirm:active { background: var(--accent2); }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.chip { padding: 7px 14px; border-radius: 99px; border: 1.5px solid var(--border); font-size: 13px; color: var(--text3); cursor: pointer; background: var(--bg3); font-family: inherit; }
.chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

/* QR (kept for CSS, element removed from HTML) */
.qr-box { display: none; }
.qr-change-btn { display: none; }

/* DRAG */
.qr-box.drag-over, .product-img-zone.drag-over, .floorplan-zone.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; background: #eef3ff; }
</style>
</head>
<body>
<div id="pc-banner">
  📱 你正在使用手機版　<a href="desktop.html">→ 切換桌面版</a>
</div>
<div id="app-root">

<!-- LOADING -->
<div class="loading-overlay hidden" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">載入中...</div>
</div>

<!-- HOME -->
<div class="screen" id="home">
  <div class="home-hero">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <div class="home-hero-label" style="font-size:12px;letter-spacing:0.2em;margin-bottom:0;">CALL SHEET</div>
      <img src="digitimes-logo.png" alt="DIGITIMES" style="height:14px;display:block;">
    </div>
    <div style="font-size:28px;font-weight:800;color:var(--text);letter-spacing:-0.02em;line-height:1.1;margin-bottom:10px;">拍攝通告單</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="sync-badge" id="sync-badge">● 已同步</span>
      <button onclick="refreshData()" style="background:var(--bg4);border:1.5px solid var(--border);border-radius:6px;color:var(--text3);padding:3px 10px;font-size:11px;cursor:pointer;">🔄</button>
    </div>
  </div>
  <div class="home-body">

    <div class="date-tabs-wrap" id="date-tabs"></div>
    <div id="date-crew-info" style="display:none;margin:0 0 8px;flex-wrap:wrap;gap:4px;"></div>
    <div id="vendor-list"></div>
    <button class="add-vendor-btn" onclick="openAddVendor()">＋ 新增拍攝項目</button>
  </div>
</div>

<!-- DETAIL -->
<div class="screen" id="detail">
  <div class="detail-nav">

function showLoading(text) { document.getElementById('loading').classList.remove('hidden'); document.getElementById('loading-text').textContent = text || '載入中...'; }
function hideLoading() { document.getElementById('loading').classList.add('hidden'); }

// ── FIREBASE: LOAD DATA (single fetch, with timeout + error handling) ──
async function initApp() {
  showLoading('連線資料庫...');
  try {
    await loadData();
  } catch(err) {
    console.error('Firebase error:', err);
    showError('連線失敗：' + (err.message || err));
    return;
  }
  hideLoading();
  renderHome();
  document.getElementById('home').classList.add('active');
}

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} 逾時 (${ms/1000}秒)`)), ms))
  ]);
}

function showError(msg) {
  hideLoading();
  const el = document.getElementById('loading');
  el.classList.remove('hidden');
  el.innerHTML = `
    <div style="text-align:center;padding:32px;">
      <div style="font-size:36px;margin-bottom:12px;">⚠️</div>
      <div style="font-size:14px;color:#555;margin-bottom:20px;">${msg}</div>
      <div style="font-size:12px;color:#aaa;margin-bottom:20px;">請確認 Firebase Firestore 規則已開放<br>expo-shooting collection 的讀寫權限</div>
      <button onclick="location.reload()" style="background:#0d1b2a;border:none;border-radius:10px;color:#fff;padding:12px 28px;font-size:14px;cursor:pointer;">重新整理</button>
    </div>`;
}

window.refreshData = async function() {
  showLoading('重新載入...');
  try {
    await loadData();
    renderHome();
  } catch(err) {
    showError('重新載入失敗：' + (err.message || err));
    return;
  }
  hideLoading();
};

function setSyncBadge(s) {
  const el = document.getElementById('sync-badge');
  if (!el) return;
  if (s === 'syncing') { el.textContent = '● 同步中'; el.style.background='rgba(245,158,11,0.2)'; el.style.color='#f59e0b'; }
  else { el.textContent = '● 已同步'; el.style.background='rgba(34,197,94,0.2)'; el.style.color='#6fcf97'; }
}


async function saveData() {
  setSyncBadge('syncing');
  await setDoc(doc(db, 'expo-shooting', 'main'), { dates, vendors, qrUrl: currentQrUrl, version: 2 });
  setSyncBadge('synced');
}



// ── CLOUDINARY UPLOAD ──
async function uploadToCloudinary(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
  const data = await res.json();
  return data.secure_url;
}

function renderHome() {
  const tabsEl = document.getElementById('date-tabs');
  tabsEl.innerHTML = '';
  dates.forEach(d => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;flex-shrink:0;';
    const btn = document.createElement('button');
    btn.className = 'date-tab' + (d.id === currentDateId ? ' active' : '');
    btn.textContent = d.label;
    btn.onclick = () => { currentDateId = d.id; renderHome(); };
    wrap.appendChild(btn);
    // Delete button (only show on active, and if more than 1 date)
    if (d.id === currentDateId && dates.length > 1) {
      const del = document.createElement('button');
      del.textContent = '✕';
      del.style.cssText = 'background:none;border:none;color:#bbb;font-size:14px;cursor:pointer;padding:0 2px 0 4px;line-height:1;';
      del.onclick = () => confirmDeleteDate(d.id, d.label);
      wrap.appendChild(del);
    }
    tabsEl.appendChild(wrap);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'add-date-btn';
  addBtn.textContent = '＋ 新增日期';
  addBtn.onclick = () => openModal('modal-date');
  tabsEl.appendChild(addBtn);

  // Show host/camera for current date - editable
  const curDate = dates.find(d => d.id === currentDateId);
  const dateInfoEl = document.getElementById('date-crew-info');
  if (dateInfoEl && curDate) {
    dateInfoEl.style.display = 'block';
    const crewParts = [];
    if (curDate.host) crewParts.push(`🎤 ${curDate.host}`);
    if (curDate.camera1||curDate.camera) crewParts.push(`🎥 ${curDate.camera1||curDate.camera}`);
    if (curDate.camera2) crewParts.push(`🎥 ${curDate.camera2}`);
    if (curDate.post) crewParts.push(`🎬 ${curDate.post}`);
    dateInfoEl.innerHTML = crewParts.map(p =>
      `<span style="font-size:12px;color:#555;margin-right:10px;">${p}</span>`
    ).join('');
  }

  const list = document.getElementById('vendor-list');
  list.innerHTML = '';
  const vlist = vendors[currentDateId] || [];
  if (vlist.length === 0) {
    list.innerHTML = '<div class="empty-state">📭 尚無拍攝項目<br>點下方按鈕新增</div>';
  } else {
    vlist.forEach(v => {
      const card = document.createElement('div');
      card.className = 'vendor-card';
      card.innerHTML = `
        <div class="time-badge"><div class="time-start">${v.start}</div><div class="time-end">${v.end}</div></div>
        <div class="vendor-info">
          <div class="vendor-name">${v.shortname}</div>
          <div class="vendor-sub">${v.booth} ｜ ${v.am}</div>
          <div class="badges">${v.interview!==false?'<span class=\"badge badge-interview\">訪談</span>':''}${v.exclusive?'<span class=\"badge badge-exclusive\">專訪</span>':''}${v.reel?'<span class=\"badge badge-reel\">短影音</span>':''}</div>
        </div>
        <div class="card-arrow">›</div>`;
      card.onclick = () => showDetail(currentDateId, v.id);
      list.appendChild(card);
    });
  }
}

// ── SHOW HOME ──
window.showHome = function() {
  document.getElementById('home').classList.add('active');
  document.getElementById('detail').classList.remove('active');
  window.scrollTo(0,0);
};

// ── DETAIL ──
window.showDetail = function(dateId, vendorId) {
  const v = (vendors[dateId] || []).find(x => x.id === vendorId);
  if (!v) return;
  currentDetail = { dateId, vendorId };
  document.getElementById('d-nav-title').textContent = v.shortname;
  document.getElementById('d-time').textContent = v.start + ' – ' + v.end;
  document.getElementById('d-name').textContent = v.shortname;
  document.getElementById('d-company').textContent = v.company;
  renderInfoTab(v);
  renderHighlightsTab(v);
  renderProductsTab(v);
  renderQATab(v);
  switchTab('info');
  document.getElementById('home').classList.remove('active');
  document.getElementById('detail').classList.add('active');
  window.scrollTo(0,0);
};

function getVendor() {
  if (!currentDetail) return null;
  return (vendors[currentDetail.dateId] || []).find(x => x.id === currentDetail.vendorId);
}

function renderInfoTab(v) {
  const floorImg = v.floorplan || '';
  document.getElementById('d-info-body').innerHTML = `
    <div class="info-card" style="margin-bottom:14px;">
      <div class="info-card-header" style="display:flex;align-items:center;justify-content:space-between;">
        <span>🗺 攤位平面圖</span>
        <span style="font-size:10px;color:#bbb;">點擊上傳或拍照</span>
      </div>
      <div class="floorplan-zone" id="floorplan-zone" onclick="triggerFloorplan()"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="handleFloorplanDrop(event)">
        ${floorImg
          ? `<img src="${floorImg}" style="width:100%;display:block;" alt="平面圖"/>
             <button class="img-change-btn" style="display:flex;position:absolute;bottom:8px;right:8px;" onclick="event.stopPropagation();triggerFloorplan()">↺ 更換</button>`
          : `<div class="img-placeholder" style="padding:28px 0;">
               <div class="img-placeholder-icon">🗺</div>
               <div class="img-placeholder-text">上傳攤位平面圖</div>
             </div>`}
      </div>
      <div style="display:flex;border-top:1px solid #f0f0f0;">
        <button class="img-action-btn" style="flex:1;" onclick="triggerFloorplanCamera()">📷 拍照</button>
        <button class="img-action-btn" style="flex:1;border-left:1px solid rgba(255,255,255,0.15);" onclick="triggerFloorplan()">🖼 相簿</button>
      </div>
      <input type="file" accept="image/*" id="floorplan-gallery" style="display:none" onchange="handleFloorplan(event)">
      <input type="file" accept="image/*" capture="environment" id="floorplan-camera" style="display:none" onchange="handleFloorplan(event)">
    </div>
    <div class="info-card">
      <div class="info-card-header">📍 拍攝資訊</div>
      <div class="info-row"><div class="info-key">攤位</div><div class="info-val">${v.booth}</div></div>
      <div class="info-row"><div class="info-key">受訪者</div><div class="info-val">${v.interviewee}</div></div>
      <div class="info-row"><div class="info-key">負責業務</div><div class="info-val">${v.am}</div></div>
      <div class="info-row"><div class="info-key">備注</div><div class="info-val" style="color:var(--text2);">${v.notes||'—'}</div></div>
    </div>`;
}

function renderProductsTab(v) {
  let html = '<div class="product-section-label">🖼 產品字卡</div>';
  (v.products || []).forEach((p, pi) => {
    const hasImg = !!p.img;
    const caption = p.caption || '';
    html += `
      <div class="product-card">
        <div class="product-card-top">
          <span class="product-card-title">${p.label}</span>
        </div>
        <div class="product-img-zone${hasImg?' has-img':' show-actions'}" id="pzone-${pi}"
          onclick="toggleImgActions(this,event)"
          ondragover="event.preventDefault();this.classList.add('drag-over')"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="handleProductImgDrop(event,${pi})">
          ${hasImg
            ? `<img src="${p.img}" alt="product"/><span class="img-tap-hint">輕觸更換圖片</span>`
            : `<div class="img-placeholder"><div class="img-placeholder-icon">🖼</div><div class="img-placeholder-text">拖曳、上傳或拍攝產品圖片</div></div>`}
          <div class="img-actions">
            <button class="img-action-btn" onclick="triggerProductImg(${pi},'camera')">📷 拍照</button>
            <button class="img-action-btn" onclick="triggerProductImg(${pi},'gallery')">🖼 相簿</button>
          </div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="pimg-camera-${pi}" style="display:none" onchange="handleProductImg(event,${pi})">
        <input type="file" accept="image/*" id="pimg-gallery-${pi}" style="display:none" onchange="handleProductImg(event,${pi})">
        <div class="product-caption-wrap">
          <span class="product-caption-label">圖說</span>
          <input class="product-caption-input" id="pcaption-${pi}" type="text" value="${p.caption||''}" placeholder="輸入圖說文字..."
            oninput="document.getElementById('pcaption-save-${pi}').style.display='flex'"
            onblur="saveCaption(${pi})">
          <button class="caption-save-btn" id="pcaption-save-${pi}" onclick="saveCaption(${pi})">儲存</button>
        </div>
        <div class="product-text">${p.text.replace(/\n/g,'<br>')}</div>
      </div>`;
  });
  html += `<button class="add-vendor-btn" onclick="openAddProduct()">＋ 新增產品字卡</button>`;
  document.getElementById('d-products-body').innerHTML = html;
}

function renderQATab(v) {
  let html = '';
  const qa = v.qa || [];
  if (qa.length === 0) {
    html += '<div class="empty-state" style="padding:32px 20px;">📝 尚無訪綱<br><span style="font-size:12px;color:#ccc;margin-top:4px;display:block;">點下方按鈕新增題目</span></div>';
  } else {
    html += '<div class="qa-card">';
    qa.forEach((q, qi) => {
      html += `<div class="qa-item">
        <div class="qa-num">${qi+1}</div>
        <div class="qa-text">${q}</div>
        <button class="delete-btn" onclick="deleteQA(${qi})">✕</button>
      </div>`;
    });
    html += '</div>';
  }
  html += `<button class="qa-add-btn" onclick="openAddQA()">＋ 新增訪問題目</button>`;
  document.getElementById('d-qa-body').innerHTML = html;
}

// ── TAB ──
window.switchTab = function(name) {
  ['info','highlights','products','qa'].forEach((t, i) => {
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
    document.querySelectorAll('.tab-btn')[i].classList.toggle('active', t===name);
  });
};

// ── PRODUCT IMG ──
window.toggleImgActions = function(zone, ev) {
  if (ev.target.closest('.img-action-btn')) return; // let the button's own click handle itself
  document.querySelectorAll('.product-img-zone.show-actions').forEach(z => { if (z !== zone) z.classList.remove('show-actions'); });
  zone.classList.toggle('show-actions');
};
window.triggerProductImg = function(pi, mode) {
  const id = mode === 'camera' ? 'pimg-camera-'+pi : 'pimg-gallery-'+pi;
  document.getElementById(id).click();
};
window.handleProductImg = async function(e, pi) {
  const file = e.target.files[0]; if (!file) return;
  const zone = document.getElementById('pzone-'+pi);
  const actions = zone.querySelector('.img-actions') ? zone.querySelector('.img-actions').outerHTML : '';
  zone.innerHTML = `<div class="img-placeholder"><div class="img-uploading">⏫ 上傳中...</div></div>${actions}`;
  try {
    const url = await uploadToCloudinary(file);
    const v = getVendor(); if (!v) return;
    v.products[pi].img = url;
    await saveData();
    renderProductsTab(v);
  } catch(err) { alert('上傳失敗，請重試'); renderProductsTab(getVendor()); }
};
window.saveCaption = async function(pi) {
  const v = getVendor(); if (!v) return;
  const val = document.getElementById('pcaption-'+pi).value;
  v.products[pi].caption = val;
  const btn = document.getElementById('pcaption-save-'+pi);
  if (btn) btn.style.display = 'none';
  await saveData();
};

// ── MODAL ──
window.openModal = function(id) { document.getElementById(id).classList.add('open'); };
window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };
document.querySelectorAll('.modal-backdrop').forEach(el => {
  el.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });
});

// ── ADD DATE ──
window.confirmAddDate = async function() {
  const val = document.getElementById('input-date').value;
  if (!val) return;
  // Parse without timezone offset to avoid day-shift bug
  const [y, m, d] = val.split('-').map(Number);
  const days = ['日','一','二','三','四','五','六'];
  const dow = new Date(y, m-1, d).getDay();
  const label = `${m}/${d} (${days[dow]})`;
  const host = document.getElementById('input-host').value.trim();
  const camera = document.getElementById('input-camera').value.trim();
  const id = 'd' + Date.now();
  dates.push({ id, label, host, camera });
  vendors[id] = [];
  currentDateId = id;
  closeModal('modal-date');
  await saveData();
};

// ── ADD VENDOR ──
window.toggleChip = function(name) {
  chipState[name] = !chipState[name];
  document.getElementById('chip-'+name).classList.toggle('selected', chipState[name]);
};
window.openAddVendor = function() {
  chipState = { interview: true, exclusive: false, reel: false };
  document.getElementById('chip-interview').classList.add('selected');
  document.getElementById('chip-reel').classList.remove('selected');
  ['v-name','v-booth','v-interviewee','v-am'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('v-start').value = '';
  document.getElementById('v-end').value = '';
  openModal('modal-vendor');
};
window.confirmAddVendor = async function() {
  const name = document.getElementById('v-name').value.trim();
  if (!name) return;
  const v = {
    id: 'v' + Date.now(),
    shortname: name,
    company: name,
    start: document.getElementById('v-start').value || '00:00',
    end: document.getElementById('v-end').value || '00:00',
    booth: document.getElementById('v-booth').value.trim(),
    interviewee: document.getElementById('v-interviewee').value.trim(),
    am: document.getElementById('v-am').value.trim(),
    exclusive: chipState.exclusive || false,
    reel: chipState.reel,
    products: [], qa: []
  };
  if (!vendors[currentDateId]) vendors[currentDateId] = [];
  vendors[currentDateId].push(v);
  vendors[currentDateId].sort((a,b) => a.start.localeCompare(b.start));
  closeModal('modal-vendor');
  await saveData();
  // stay on current scroll position
};

// ── ADD PRODUCT ──
window.openAddProduct = function() {
  document.getElementById('p-label').value = '';
  document.getElementById('p-text').value = '';
  openModal('modal-product');
};
window.confirmAddProduct = async function() {
  const v = getVendor(); if (!v) return;
  const label = document.getElementById('p-label').value.trim() || '產品字卡';
  const text = document.getElementById('p-text').value.trim();
  v.products.push({ label, text, img: '' });
  closeModal('modal-product');
  await saveData();
  renderProductsTab(v);
  // stay on products tab
};

// ── HIGHLIGHTS ──
function renderHighlightsTab(v) {
  const hl = v.highlights || [];
  let html = '';
  if (hl.length === 0) {
    html += '<div class="empty-state" style="padding:32px 20px;">⭐ 尚無展出亮點<br><span style="font-size:12px;color:#ccc;margin-top:4px;display:block;">點下方按鈕新增</span></div>';
  } else {
    hl.forEach((h, hi) => {
      html += `<div class="highlight-card">
        <div class="highlight-card-header">
          <span class="highlight-card-title">⭐ ${h.title}</span>
          <button class="highlight-delete-btn" onclick="deleteHighlight(${hi})">刪除</button>
        </div>
        <div class="highlight-body"><div class="highlight-text">${h.text}</div></div>
      </div>`;
    });
  }
  html += `<button class="highlight-add-btn" onclick="openAddHighlight()">＋ 新增展出亮點</button>`;
  document.getElementById('d-highlights-body').innerHTML = html;
}
window.openAddHighlight = function() {
  document.getElementById('hl-title').value = '';
  document.getElementById('hl-text').value = '';
  openModal('modal-highlight');
};
window.confirmAddHighlight = async function() {
  const v = getVendor(); if (!v) return;
  const title = document.getElementById('hl-title').value.trim();
  const text = document.getElementById('hl-text').value.trim();
  if (!title && !text) return;
  if (!v.highlights) v.highlights = [];
  v.highlights.push({ title: title || '亮點', text });
  closeModal('modal-highlight');
  await saveData();
  renderHighlightsTab(v);
  // stay on highlights tab
};
window.deleteHighlight = async function(hi) {
  const v = getVendor(); if (!v) return;
  v.highlights.splice(hi, 1);
  await saveData();
  renderHighlightsTab(v);
};

// ── ADD QA ──
window.openAddQA = function() { document.getElementById('qa-text').value = ''; openModal('modal-qa'); };
window.confirmAddQA = async function() {
  const v = getVendor(); if (!v) return;
  const text = document.getElementById('qa-text').value.trim();
  if (!text) return;
  if (!v.qa) v.qa = [];
  v.qa.push(text);
  closeModal('modal-qa');
  await saveData();
  renderQATab(v);
  // stay on qa tab — no scroll
};
window.deleteQA = async function(qi) {
  const v = getVendor(); if (!v) return;
  v.qa.splice(qi, 1);
  await saveData();
  renderQATab(v);
};

// ── DELETE DATE ──
// ── DRAG & DROP ──
window.handleQRDrop = function() {};
window.handleProductImgDrop = async function(e, pi) {
  e.preventDefault();
  document.getElementById('pzone-'+pi)?.classList.remove('drag-over');
  const file = [...(e.dataTransfer.files || [])].find(f => f.type.startsWith('image/'));
  if (!file) return;
  const zone = document.getElementById('pzone-'+pi);
  if (zone) zone.innerHTML = '<div class="img-placeholder" style="padding:28px 0;"><div class="img-uploading">⏫ 上傳中...</div></div>';
  try {
    const url = await uploadToCloudinary(file);
    const v = getVendor(); if (!v) return;
    v.products[pi].img = url;
    await saveData();
    renderProductsTab(v);
  } catch(err) { alert('上傳失敗，請重試'); renderProductsTab(getVendor()); }
};
window.handleFloorplanDrop = async function(e) {
  e.preventDefault();
  document.getElementById('floorplan-zone')?.classList.remove('drag-over');
  const file = [...(e.dataTransfer.files || [])].find(f => f.type.startsWith('image/'));
  if (!file) return;
  const zone = document.getElementById('floorplan-zone');
  if (zone) zone.innerHTML = '<div class="img-placeholder" style="padding:28px 0;"><div class="img-uploading">⏫ 上傳中...</div></div>';
  try {
    const url = await uploadToCloudinary(file);
    const v = getVendor(); if (!v) return;
    v.floorplan = url;
    await saveData();
    renderInfoTab(v);
  } catch(err) { alert('上傳失敗，請重試'); renderInfoTab(getVendor()); }
};
// Paste image (Ctrl+V) for QR


window.confirmDeleteDate = function(dateId, label) {
  if (!confirm(`確定要刪除「${label}」的所有拍攝資料嗎？\n此操作無法復原。`)) return;
  dates = dates.filter(d => d.id !== dateId);
  delete vendors[dateId];
  currentDateId = dates[0]?.id || null;
  saveData();
};

// ── FLOORPLAN ──
window.triggerFloorplan = function() { document.getElementById('floorplan-gallery').click(); };
window.triggerFloorplanCamera = function() { document.getElementById('floorplan-camera').click(); };
window.handleFloorplan = async function(e) {
  const file = e.target.files[0]; if (!file) return;
  const zone = document.getElementById('floorplan-zone');
  if (zone) zone.innerHTML = '<div class="img-placeholder" style="padding:28px 0;"><div class="img-uploading">⏫ 上傳中...</div></div>';
  try {
    const url = await uploadToCloudinary(file);
    const v = getVendor(); if (!v) return;
    v.floorplan = url;
    await saveData();
    renderInfoTab(v);
  } catch(err) { alert('上傳失敗，請重試'); renderInfoTab(getVendor()); }
};

</script>
