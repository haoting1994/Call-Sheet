<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALL SHEET — 拍攝通告單 2026 · DIGITIMES</title>
<style>
/* ═══════════════════════════════════════
   CALL SHEET — Production Tool
   Font: system mono + sans
═══════════════════════════════════════ */
:root {
  --bg:       #f4f6fa;
  --bg2:      #ffffff;
  --bg3:      #f8f9fc;
  --bg4:      #eef1f7;
  --border:   #dde3f0;
  --border2:  #c4cfea;
  --text:     #0f1a2e;
  --text2:    #3d5278;
  --text3:    #7a8fab;
  --accent:   #1a56db;
  --accent2:  #1040b0;
  --accent-glow: rgba(26,86,219,0.15);
  --green:    #0a7a3e;
  --green-bg: #e6f5ed;
  --amber:    #92600a;
  --amber-bg: #fef6e4;
  --red:      #c0180c;
  --red-bg:   #fde8e8;
  --panel-bg: #f0f3f9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: 'SF Pro Text', -apple-system, 'PingFang TC', 'Heiti TC', sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 15px; line-height: 1.6;
}

/* ── LOCK ── */
#lock-screen {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, #e8eef8 0%, #f4f6fa 50%, #eaf0fb 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#lock-screen.hidden { display: none; }
.lock-box {
  width: 380px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 40px 36px;
  box-shadow: 0 8px 40px rgba(26,86,219,0.10), 0 1px 4px rgba(0,0,0,0.06);
}
.lock-wordmark {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 10px; letter-spacing: 0.25em; color: var(--accent);
  text-transform: uppercase; margin-bottom: 24px;
  display: flex; align-items: center; gap: 10px;
}
.lock-wordmark::before, .lock-wordmark::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.lock-title {
  font-size: 32px; font-weight: 800; color: var(--text);
  letter-spacing: -0.03em; line-height: 1; margin-bottom: 6px;
}
.lock-sub { font-size: 11px; color: var(--text3); margin-bottom: 32px; letter-spacing: 0.05em; }
.lock-form input {
  width: 100%; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 12px 16px; font-size: 15px; color: var(--text);
  outline: none; margin-bottom: 10px; font-family: inherit;
  text-align: center; transition: border-color 0.15s, box-shadow 0.15s;
}
.lock-form input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
  background: #fff;
}
.lock-btn {
  width: 100%; background: var(--accent); border: none; border-radius: 8px;
  padding: 12px; font-size: 13px; font-weight: 700; color: #fff;
  cursor: pointer; letter-spacing: 0.04em;
  transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
  box-shadow: 0 2px 8px rgba(26,86,219,0.25);
}
.lock-btn:hover { background: var(--accent2); box-shadow: 0 4px 16px rgba(26,86,219,0.35); transform: translateY(-1px); }
.lock-btn:active { transform: translateY(0); }
.lock-error { color: var(--red); font-size: 12px; text-align: center; margin-top: 8px; min-height: 18px; }

/* ── LOADING ── */
.loading-overlay {
  position: fixed; inset: 0; background: rgba(244,246,250,0.92); z-index: 500;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
.loading-overlay.hidden { display: none; }
.spinner {
  width: 32px; height: 32px; border: 2px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 12px; color: var(--text2); letter-spacing: 0.06em; }

/* ── APP SHELL ── */
#app { display: none; height: 100vh; flex-direction: column; }
#app.active { display: flex; }

/* ── TOPBAR ── */
.topbar {
  background: #fff; border-bottom: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 52px; flex-shrink: 0; z-index: 20;
  box-shadow: 0 1px 6px rgba(26,86,219,0.06);
}
.topbar-left { display: flex; align-items: center; gap: 0; }
.topbar-wordmark {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 16px; font-weight: 800; color: var(--text);
  letter-spacing: 0.06em;
  padding-right: 20px; margin-right: 20px;
  border-right: 1.5px solid var(--border);
}
.topbar-wordmark span { color: var(--accent); }
.topbar-context { font-size: 12px; color: var(--text3); letter-spacing: 0.04em; font-family: 'SF Mono', monospace; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.sync-badge {
  font-size: 10px; font-family: 'SF Mono', monospace; letter-spacing: 0.08em;
  padding: 3px 10px; border-radius: 3px;
  background: var(--green-bg); color: var(--green);
  border: 1px solid rgba(10,122,62,0.2);
}
.sync-badge.syncing {
  background: var(--amber-bg); color: var(--amber);
  border-color: rgba(146,96,10,0.2);
}
.topbar-btn {
  background: var(--bg3); border: 1.5px solid var(--border); border-radius: 6px;
  color: var(--text2); padding: 7px 16px; font-size: 13px; cursor: pointer;
  font-family: inherit; transition: all 0.15s; letter-spacing: 0.02em;
}
.topbar-btn:hover {
  background: var(--accent); color: #fff; border-color: var(--accent);
  box-shadow: 0 2px 8px rgba(26,86,219,0.2); transform: translateY(-1px);
}
.topbar-btn:active { transform: translateY(0); }

/* ── DATE BAR (now inside sidebar) ── */
.sidebar-dates-row {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 10px; border-bottom: 1.5px solid var(--border);
  background: var(--bg3);
}
.date-bar {
  display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0;
  overflow-x: auto;
}
.date-bar::-webkit-scrollbar { display: none; }
.dbar-tab {
  border: none; background: none; padding: 7px 12px;
  font-size: 13px; font-weight: 600; color: var(--text3); cursor: pointer;
  border-radius: 6px; white-space: nowrap;
  transition: all 0.12s; font-family: inherit; letter-spacing: 0.02em;
}
.dbar-tab.active { color: #fff; background: var(--accent); }
.dbar-tab:hover:not(.active) { color: var(--accent); background: rgba(26,86,219,0.08); }
.dbar-del {
  border: none; background: none; color: var(--text3); font-size: 12px;
  cursor: pointer; padding: 2px 4px; transition: color 0.12s; flex-shrink: 0;
}
.dbar-del:hover { color: var(--red); }
.sidebar-date-add {
  background: var(--bg4); border: 1.5px solid var(--border2); border-radius: 6px;
  color: var(--text2); width: 28px; height: 28px; flex-shrink: 0; cursor: pointer;
  font-size: 15px; font-family: inherit; transition: all 0.15s;
}
.sidebar-date-add:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── LAYOUT ── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: 280px; flex-shrink: 0; background: #fff;
  border-right: 1.5px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-title {
  font-family: 'SF Mono', monospace; font-size: 12px; font-weight: 700;
  color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase;
}
.sidebar-add-btn {
  background: var(--accent); border: none; border-radius: 4px;
  color: #fff; padding: 7px 14px; font-size: 13px; cursor: pointer;
  font-family: inherit; font-weight: 600; transition: background 0.12s;
}
.sidebar-add-btn:hover { background: var(--accent2); }
.sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
.sidebar-list::-webkit-scrollbar { width: 3px; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--border2); }

.s-card {
  border-radius: 6px; padding: 10px 12px; margin-bottom: 3px;
  cursor: pointer; border: 1.5px solid transparent;
  transition: all 0.15s; display: flex; align-items: center; gap: 10px;
  position: relative;
}
.s-card:hover {
  background: #f0f4ff; border-color: var(--border2);
  transform: translateX(2px);
  box-shadow: 0 2px 8px rgba(26,86,219,0.08);
}
.s-card.active {
  background: #eef3ff; border-color: var(--accent);
  box-shadow: 0 2px 12px rgba(26,86,219,0.12);
}
.s-card.active::before {
  content: ''; position: absolute; left: -1px; top: 4px; bottom: 4px;
  width: 3px; background: var(--accent); border-radius: 0 2px 2px 0;
}
.s-time {
  background: var(--bg4); border: 1.5px solid var(--border);
  border-radius: 5px; padding: 5px 8px; text-align: center;
  min-width: 50px; flex-shrink: 0;
  font-family: 'SF Mono', monospace;
}
.s-time-start { font-size: 14px; font-weight: 700; color: var(--accent); }
.s-time-end { font-size: 11px; color: var(--text3); margin-top: 1px; }
.s-card.active .s-time { background: var(--accent); border-color: var(--accent); }
.s-card.active .s-time-start { color: #fff; }
.s-card.active .s-time-end { color: rgba(255,255,255,0.65); }
.s-info { flex: 1; min-width: 0; }
.s-name { font-size: 15px; font-weight: 600; color: var(--text); }
.s-sub { font-size: 12px; color: var(--text3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-badges { display: flex; gap: 4px; margin-top: 5px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 3px; font-family: 'SF Mono', monospace; letter-spacing: 0.04em; }
.badge-interview { background: var(--green-bg); color: var(--green); border: 1px solid rgba(10,122,62,0.2); }
.badge-reel { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(146,96,10,0.2); }
.badge-exclusive { background: #ede9fe; color: #5b21b6; border: 1px solid rgba(91,33,182,0.2); }
.s-empty { text-align: center; padding: 48px 16px; color: var(--text3); font-size: 12px; line-height: 1.8; }
.s-del-btn { background: none; border: none; font-size: 14px; cursor: pointer; opacity: 0; padding: 4px; border-radius: 4px; flex-shrink: 0; transition: opacity 0.15s, background 0.15s; }
.s-card:hover .s-del-btn { opacity: 0.5; }
.s-del-btn:hover { opacity: 1 !important; background: var(--red-bg); }

/* ── RIGHT PANEL ── */
.panel { flex: 1; overflow-y: auto; background: var(--bg); }
.panel::-webkit-scrollbar { width: 4px; }
.panel::-webkit-scrollbar-thumb { background: var(--border); }

.panel-empty {
  height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--text3); gap: 12px; background: var(--bg);
}
.panel-empty-icon { font-size: 40px; opacity: 0.4; }
.panel-empty-text { font-size: 13px; letter-spacing: 0.05em; }

/* ── PANEL HERO ── */
.panel-hero {
  background: #fff; border-bottom: 1.5px solid var(--border);
  border-top: 3px solid var(--accent);
  padding: 14px 28px 10px;
  box-shadow: 0 2px 8px rgba(26,86,219,0.05);
}
.ph-time {
  font-family: 'SF Mono', monospace; font-size: 13px; color: var(--accent);
  letter-spacing: 0.1em; margin-bottom: 2px; line-height: 1.15;
}
.ph-name { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; line-height: 1.1; }
.ph-crew {
  display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  font-family: 'SF Mono', monospace; font-size: 13px; color: var(--text2);
  margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); line-height: 1.2;
}
.ph-crew span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.ph-crew input {
  border: none; background: transparent; color: var(--text2); font-family: inherit;
  font-size: 13px; outline: none; width: 66px;
  border-bottom: 1px dashed transparent; transition: border-color 0.15s;
}
.ph-crew input:hover { border-bottom-color: var(--border2); }
.ph-crew input:focus { border-bottom-color: var(--accent); color: var(--text); }
.crew-chips { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.crew-chip {
  display: inline-flex; align-items: center; gap: 4px; background: var(--bg4);
  border: 1px solid var(--border2); border-radius: 4px; padding: 1px 4px 1px 8px;
  font-family: inherit; font-size: 12px; color: var(--text2);
}
.crew-chip button {
  border: none; background: none; color: var(--text3); font-size: 12px;
  cursor: pointer; padding: 0 3px; line-height: 1;
}
.crew-chip button:hover { color: var(--red); }
.crew-chip-add {
  border: 1px dashed var(--border2); background: transparent; border-radius: 4px;
  color: var(--text3); font-family: inherit; font-size: 12px; outline: none;
  width: 78px; padding: 2px 6px;
}
.crew-chip-add:hover { border-color: var(--border2); color: var(--text2); }
.crew-chip-add:focus { border-color: var(--accent); color: var(--text); background: rgba(59,130,246,0.06); }
.ph-meta {
  font-size: 12px; color: var(--text2); margin-top: 4px; line-height: 1.2;
  display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
}
.ph-meta span { display: flex; align-items: center; gap: 5px; }

/* ── PANEL TABS ── */
.panel-tabs {
  background: #fff; border-bottom: 1.5px solid var(--border);
  display: flex; padding: 0 28px; position: sticky; top: 0; z-index: 5;
  box-shadow: 0 1px 4px rgba(26,86,219,0.04);
}
.ptab {
  border: none; background: none; padding: 13px 20px;
  font-size: 14px; font-weight: 500; color: var(--text3); cursor: pointer;
  border-bottom: 2px solid transparent; font-family: inherit;
  transition: all 0.12s; letter-spacing: 0.03em;
}
.ptab.active { color: var(--text); border-bottom-color: var(--accent); }
.ptab:hover:not(.active) { color: var(--text2); }

/* ── PANEL BODY ── */
.panel-body { padding: 14px 28px; max-width: 960px; }

/* ── DATA ROWS ── */
.pc-section { margin-bottom: 20px; }
.pc-section-title {
  font-family: 'SF Mono', monospace; font-size: 12px; font-weight: 600;
  color: var(--text3); letter-spacing: 0.15em; text-transform: uppercase;
  margin-bottom: 8px; padding-left: 2px;
}
.pc-card {
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 8px; overflow: hidden;
  box-shadow: 0 1px 4px rgba(26,86,219,0.05);
  transition: box-shadow 0.15s, border-color 0.15s;
}
.pc-card:hover { box-shadow: 0 4px 16px rgba(26,86,219,0.10); border-color: var(--border2); }
.pc-row {
  display: flex; padding: 10px 14px; border-bottom: 1px solid var(--border);
  gap: 16px; align-items: flex-start; transition: background 0.12s;
}
.pc-row:hover { background: #f7f9ff; }
.pc-row:last-child { border-bottom: none; }
.pc-key {
  font-family: 'SF Mono', monospace; font-size: 13px; color: var(--text3);
  min-width: 68px; flex-shrink: 0; padding-top: 1px; letter-spacing: 0.04em;
}
.pc-val { font-size: 15px; color: var(--text); line-height: 1.6; }

/* ── FLOORPLAN ── */
.pc-floorplan {
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 8px; overflow: hidden; margin-bottom: 20px;
  box-shadow: 0 1px 4px rgba(26,86,219,0.05);
  transition: border-color 0.15s;
}
.pc-floorplan:hover { border-color: var(--border2); }
.pc-floorplan-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  font-family: 'SF Mono', monospace; font-size: 12px; font-weight: 600;
  color: var(--text3); letter-spacing: 0.15em; text-transform: uppercase;
  display: flex; justify-content: space-between; align-items: center;
}
.pc-floorplan-img { width: 100%; display: block; max-height: 400px; object-fit: contain; background: var(--bg4); }
.pc-floorplan-drop {
  background: var(--bg4); border: 1.5px dashed var(--border2);
  border-radius: 4px; margin: 12px 14px;
  padding: 36px; text-align: center; cursor: pointer;
  transition: all 0.15s; position: relative;
}
.pc-floorplan-drop:hover, .pc-floorplan-drop.drag-over {
  background: rgba(59,130,246,0.06); border-color: var(--accent);
}
.pc-floorplan-drop p { font-size: 12px; color: var(--text3); margin-top: 8px; }

/* ── PRODUCTS GRID ── */
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.pc-product {
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 8px; overflow: hidden;
  transition: all 0.15s;
  box-shadow: 0 1px 4px rgba(26,86,219,0.05);
}
.pc-product:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 20px rgba(26,86,219,0.12);
  transform: translateY(-2px);
}
.pc-product-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  font-family: 'SF Mono', monospace; font-size: 12px; font-weight: 600;
  color: var(--text3); letter-spacing: 0.08em;
}
.pc-product-subhead {
  padding: 7px 16px 5px; font-family: 'SF Mono', monospace; font-size: 10.5px;
  font-weight: 700; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase;
  background: var(--bg4); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.pc-product-subhead span.hint { font-weight: 400; letter-spacing: 0.02em; color: var(--text3); opacity: 0.85; text-transform: none; font-size: 10.5px; }
.pc-product-img {
  width: 100%; aspect-ratio: 16 / 5; background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative; overflow: hidden;
  border-bottom: 1px solid var(--border); transition: background 0.15s;
}
.pc-product-img:hover { background: #eef2ff; }
.pc-product-img img { width: 100%; height: 100%; object-fit: contain; }
.pc-product-img.drag-over { background: rgba(59,130,246,0.08); }
.pc-product-drop-hint { text-align: center; }
.pc-product-drop-hint div:first-child { font-size: 24px; color: var(--text3); opacity: 0.5; }
.pc-product-drop-hint div:last-child { font-size: 11px; color: var(--text3); margin-top: 6px; }
.pc-product-photo {
  width: 100%; aspect-ratio: 4 / 3; background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative; overflow: hidden;
  border-bottom: 1px solid var(--border); transition: background 0.15s;
}
.pc-product-photo:hover { background: #eef2ff; }
.pc-product-photo img { width: 100%; height: 100%; object-fit: cover; }
.pc-product-photo.drag-over { background: rgba(59,130,246,0.08); }
.pc-product-photo-tag {
  position: absolute; top: 8px; left: 8px; z-index: 2;
  background: rgba(17,20,24,0.78); color: #fff; font-family: 'SF Mono', monospace;
  font-size: 10px; letter-spacing: 0.05em; padding: 3px 9px; border-radius: 4px;
  pointer-events: none;
}
.pc-img-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(17,20,24,0.85); display: flex;
}
.pc-img-btn {
  flex: 1; border: none; background: none; color: var(--text2);
  padding: 8px; font-size: 11px; cursor: pointer; transition: color 0.12s;
}
.pc-img-btn:not(:last-child) { border-right: 1px solid var(--border); }
.pc-img-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.pc-product-caption {
  padding: 7px 14px; border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center; background: var(--bg4);
}
.pc-product-caption label { font-family: 'SF Mono', monospace; font-size: 10px; color: var(--text3); flex-shrink: 0; letter-spacing: 0.06em; }
.pc-product-caption input { flex: 1; border: none; background: transparent; font-size: 12px; color: var(--text2); outline: none; font-family: inherit; }
.pc-product-caption input:focus { color: var(--text); }
.pc-product-caption button { background: var(--accent); border: none; border-radius: 3px; color: #fff; padding: 3px 8px; font-size: 10px; cursor: pointer; display: none; }
.pc-product-text { padding: 12px 16px; font-size: 14px; color: var(--text2); line-height: 1.7; background: #fff; }
.pc-shot-setphoto-btn {
  position: absolute; bottom: 2px; left: 0; right: 0;
  background: rgba(26,86,219,0.9); color: #fff; border: none;
  font-size: 8.5px; font-family: 'SF Mono', monospace; letter-spacing: 0.02em;
  padding: 2px 0; cursor: pointer; opacity: 0; transition: opacity 0.15s;
}
.pc-shot-wrap:hover .pc-shot-setphoto-btn { opacity: 1; }
.pc-add-btn {
  background: transparent; border: 1.5px dashed var(--border2); border-radius: 6px; padding: 16px;
  text-align: center; cursor: pointer; font-size: 12px; color: var(--text3); width: 100%;
  transition: all 0.15s; font-family: inherit; letter-spacing: 0.04em;
}
.pc-add-btn:hover { background: rgba(59,130,246,0.06); border-color: var(--accent); color: var(--accent); }

/* ── QA ── */
.qa-list { display: flex; flex-direction: column; gap: 2px; }
.pc-qa-item {
  background: #fff; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start;
  transition: all 0.15s; box-shadow: 0 1px 3px rgba(26,86,219,0.04);
}
.pc-qa-item:hover { border-color: var(--accent); box-shadow: 0 3px 12px rgba(26,86,219,0.1); }
.pc-qa-num {
  width: 22px; height: 22px; background: var(--accent); color: #fff;
  border-radius: 4px; font-size: 10px; font-weight: 700; font-family: 'SF Mono', monospace;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
}
.pc-qa-text { font-size: 15px; color: var(--text); line-height: 1.7; flex: 1; }
.pc-qa-del { background: none; border: none; color: var(--text3); font-size: 16px; cursor: pointer; flex-shrink: 0; transition: color 0.12s; }
.pc-qa-del:hover { color: var(--red); }

/* ── HIGHLIGHTS ── */
.hl-list { display: flex; flex-direction: column; gap: 8px; }
.pc-hl-card {
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 8px; overflow: hidden;
  transition: all 0.15s; box-shadow: 0 1px 4px rgba(26,86,219,0.05);
}
.pc-hl-card:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(26,86,219,0.10); }
.pc-hl-header {
  background: linear-gradient(90deg, #f0f4ff 0%, #f8f9ff 100%);
  border-bottom: 1.5px solid var(--border);
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
}
.pc-hl-title { font-size: 15px; font-weight: 600; color: var(--text); }
.pc-hl-del {
  background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
  border-radius: 4px; color: var(--red); padding: 3px 10px; font-size: 11px; cursor: pointer;
}
.pc-hl-body { padding: 0; }

/* ── MODAL ── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: none; align-items: center; justify-content: center; }
.modal-backdrop.open { display: flex; }
.modal {
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 12px; width: 480px; max-width: 95vw; padding: 24px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 16px 48px rgba(26,86,219,0.15), 0 2px 8px rgba(0,0,0,0.08);
}
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
.modal label {
  font-family: 'SF Mono', monospace; font-size: 12px; font-weight: 600;
  color: var(--text3); display: block; margin-bottom: 5px; margin-top: 14px;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.modal input, .modal textarea {
  width: 100%; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 6px; padding: 10px 14px; font-size: 15px; font-family: inherit;
  color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
}
.modal input:focus, .modal textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); background: #fff; }
.modal textarea { resize: none; min-height: 90px; }
.modal-row { display: flex; gap: 10px; }
.modal-row > div { flex: 1; }
.modal-btns { display: flex; gap: 8px; margin-top: 20px; }
.btn-cancel {
  flex: 1; background: var(--bg4); border: 1px solid var(--border2);
  border-radius: 5px; padding: 12px; font-size: 15px; color: var(--text2);
  cursor: pointer; font-family: inherit;
}
.btn-cancel:hover { color: var(--text); border-color: var(--border2); }
.btn-confirm {
  flex: 2; background: var(--accent); border: none; border-radius: 5px;
  padding: 12px; font-size: 15px; color: #fff; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: background 0.12s;
}
.btn-confirm:hover { background: var(--accent2); }
.chip-row { display: flex; gap: 8px; margin-top: 6px; }
.chip {
  padding: 8px 16px; border-radius: 4px; border: 1px solid var(--border2);
  font-size: 14px; color: var(--text2); cursor: pointer; background: var(--bg3); font-family: inherit;
}
.chip.selected { background: rgba(59,130,246,0.15); color: var(--accent); border-color: rgba(59,130,246,0.4); }

/* ── EDITABLE FIELDS ── */
.editable {
  border: none; background: transparent; font-family: inherit;
  color: inherit; outline: none; width: 100%; line-height: 1.2;
  border-bottom: 1px dashed transparent; transition: border-color 0.15s;
  -webkit-appearance: none; appearance: none; display: inline-block; vertical-align: middle; margin: 0;
}
.editable:hover { border-bottom-color: rgba(255,255,255,0.15); }
.editable:focus { border-bottom-color: var(--accent); background: rgba(59,130,246,0.06); border-radius: 3px; padding: 0 4px; }
.editable-dark {
  border: none; background: transparent; font-family: inherit;
  color: var(--text); outline: none; width: 100%;
  border-bottom: 1px dashed transparent; transition: border-color 0.15s;
}
.editable-dark:hover { border-bottom-color: var(--border2); }
.editable-dark:focus { border-bottom-color: var(--accent); background: rgba(59,130,246,0.06); border-radius: 3px; padding: 2px 5px; }
.editable-area {
  border: none; background: transparent; font-family: inherit;
  color: var(--text2); outline: none; width: 100%; resize: none;
  line-height: 1.6; font-size: 15px;
  border: 1px dashed transparent; border-radius: 4px;
  transition: border-color 0.15s; padding: 2px 4px; min-height: 0;
}
.editable-area:hover { border-color: var(--border2); }
.editable-area:focus { border-color: var(--accent); background: rgba(59,130,246,0.04); }
.edit-hint { font-size: 10px; color: rgba(255,255,255,0.2); margin-left: 8px; font-weight: 400; }
.pc-qa-item textarea {
  border: none; background: transparent; font-family: inherit;
  color: var(--text); outline: none; width: 100%; resize: none;
  line-height: 1.7; font-size: 13px; min-height: 32px;
  border-bottom: 1px dashed transparent; transition: border-color 0.15s;
}
.pc-qa-item textarea:hover { border-bottom-color: var(--border2); }
.pc-qa-item textarea:focus { border-bottom-color: var(--accent); background: rgba(59,130,246,0.04); border-radius: 3px; padding: 3px 5px; }
.pc-hl-title-input {
  border: none; background: transparent; font-family: inherit;
  color: var(--text); outline: none; font-size: 13px; font-weight: 600;
  border-bottom: 1px dashed transparent; transition: border-color 0.15s; width: calc(100% - 70px);
}
.pc-hl-title-input:hover { border-bottom-color: var(--border2); }
.pc-hl-title-input:focus { border-bottom-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); border-radius: 3px; padding: 0 4px; }
.pc-product-label-input {
  border: none; background: transparent; font-family: inherit;
  color: var(--text); outline: none; font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
  width: calc(100% - 110px); border-bottom: 1px dashed transparent;
}
.pc-product-label-input:hover { border-bottom-color: var(--border2); }
.pc-product-label-input:focus { border-bottom-color: var(--accent); background: rgba(59,130,246,0.06); border-radius: 3px; padding: 0 4px; }

/* ── POST PRODUCTION ── */
.post-card-header-row {
  min-height: 72px; padding: 10px 18px; border-bottom: 1px solid #f0f0f0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.post-card-mini-thumb {
  height: 58px; max-width: 200px; object-fit: contain; border-radius: 4px;
  border: 1px solid var(--border); background: #fff; cursor: pointer;
  flex-shrink: 0; transition: border-color 0.15s;
}
.post-card-mini-thumb:hover { border-color: var(--accent); }
.post-card-mini-empty {
  display: inline-flex; align-items: center; justify-content: center;
  width: 68px; height: 58px; font-size: 18px; color: var(--text3);
  background: var(--bg4); border-style: dashed; cursor: default;
}
.post-card-textcol {
  flex: 1; min-width: 0; font-size: 13px; color: var(--text2); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; padding: 4px 12px; border-left: 1px dashed var(--border);
}
.post-card-textcol-empty { color: var(--text3); font-style: italic; }
.post-section { border-top: 1.5px solid var(--border); padding: 16px; background: var(--bg3); }
.post-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.post-section-title { font-family: 'SF Mono', monospace; font-size: 12px; font-weight: 600; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; }
.post-add-btn { background: var(--accent); border: none; border-radius: 4px; color: #fff; padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 600; flex-shrink: 0; }
.post-add-btn:hover { background: var(--accent2); }
.post-shots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.post-shot { background: #fff; border-radius: 8px; overflow: hidden; border: 1.5px solid var(--border); transition: all 0.15s; box-shadow: 0 1px 3px rgba(26,86,219,0.05); }
.post-shot:hover { border-color: var(--accent); box-shadow: 0 3px 10px rgba(26,86,219,0.12); transform: translateY(-1px); }
.post-shot-img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--bg3); display: block; cursor: pointer; }
.post-shot-drop {
  width: 100%; aspect-ratio: 16 / 9; background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 12px; color: var(--text3); text-align: center;
  border: 1.5px dashed var(--border2); border-radius: 8px; transition: all 0.15s;
}
.post-shot-drop:hover, .post-shot-drop.drag-over { background: rgba(59,130,246,0.06); border-color: var(--accent); color: var(--accent); }
.post-shot-img-wrap { position: relative; }
.post-shot-hero { border-color: var(--accent); border-width: 2px; }
.post-shot-hero .post-shot-img { aspect-ratio: 4 / 3; }
.post-shot-hero-tag {
  position: absolute; top: 8px; left: 8px; z-index: 2;
  background: rgba(26,86,219,0.88); color: #fff; font-family: 'SF Mono', monospace;
  font-size: 11px; letter-spacing: 0.03em; padding: 4px 10px; border-radius: 5px;
  pointer-events: none;
}
.post-shot-usebtn {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(26,86,219,0.88); color: #fff; border: none;
  font-size: 10px; font-family: inherit; padding: 4px 0; cursor: pointer;
  opacity: 0; transition: opacity 0.15s;
}
.post-shot-img-wrap:hover .post-shot-usebtn { opacity: 1; }
.post-shot-usebtn.is-set { opacity: 1; background: rgba(10,122,62,0.88); }
.post-shot-fileno-row { padding: 6px 8px 2px; display: flex; align-items: center; gap: 5px; }
.post-shot-fileno-row label { font-family: 'SF Mono', monospace; font-size: 9px; color: var(--text3); letter-spacing: 0.06em; flex-shrink: 0; }
.post-shot-footer { padding: 2px 8px 6px; display: flex; align-items: center; gap: 4px; }
.post-shot-filename {
  flex: 1; border: none; background: var(--bg4); font-size: 12px; font-family: 'SF Mono', monospace;
  color: var(--text2); outline: none; min-width: 0; border: 1px dashed var(--border);
  border-radius: 4px; padding: 3px 6px;
}
.post-shot-filename:hover { border-color: var(--border2); }
.post-shot-filename:focus { border-color: var(--accent); background: #fff; }
.post-shot-filename::placeholder { color: var(--text3); }
.post-shot-del { background: none; border: none; color: var(--text3); font-size: 12px; cursor: pointer; flex-shrink: 0; padding: 0; }
.post-shot-del:hover { color: var(--red); }
.post-empty {
  text-align: center; padding: 16px; font-size: 11px; color: var(--text3);
  border: 1.5px dashed var(--border); border-radius: 5px; cursor: pointer; transition: all 0.15s;
}
.post-empty:hover { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.04); }

/* ── MICRO INTERACTIONS ── */
button, .s-card, .pc-product, .dbar-tab, .ptab, .pc-add-btn, .post-empty {
  cursor: pointer;
}
a { color: var(--accent); }
::selection { background: var(--accent-glow); color: var(--accent2); }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg3); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* FLOORPLAN drop zone hover */
.pc-floorplan-drop {
  background: var(--bg3); border: 1.5px dashed var(--border2);
}
.pc-floorplan-drop:hover, .pc-floorplan-drop.drag-over {
  background: #eef3ff; border-color: var(--accent);
}

/* Sidebar add btn hover */
.sidebar-add-btn { transition: all 0.15s; }
.sidebar-add-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(26,86,219,0.2); }

/* Post add btn */
.post-add-btn { transition: all 0.15s; }
.post-add-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(26,86,219,0.2); }

/* ptab hover */
.ptab { transition: all 0.15s; }
.ptab:hover:not(.active) { color: var(--accent); background: rgba(26,86,219,0.04); }

/* dbar-tab hover */
.dbar-tab:hover:not(.active) { color: var(--accent); background: rgba(26,86,219,0.04); }

/* btn-confirm pulse */
.btn-confirm:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(26,86,219,0.3); }
.btn-confirm:active { transform: translateY(0); }
.btn-cancel:hover { background: var(--bg4); }

/* pc-img-btn hover */
.pc-img-btn:hover { background: rgba(26,86,219,0.12); color: var(--accent); }

/* ── DRAG DROP ── */
.drop-zone { position: relative; transition: all 0.15s; }
.drop-zone.drag-over::after {
  content: 'DROP TO UPLOAD';
  font-family: 'SF Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em;
  position: absolute; inset: 0; background: rgba(26,86,219,0.06);
  border: 2px dashed var(--accent); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); z-index: 10; pointer-events: none;
  box-shadow: inset 0 0 20px rgba(26,86,219,0.05);
}

/* ── MICRO INTERACTIONS ── */
button, .s-card, .pc-product, .dbar-tab, .ptab, .pc-add-btn, .post-empty { cursor: pointer; }
::selection { background: rgba(26,86,219,0.15); color: #1040b0; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg3); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }
.sidebar-add-btn { transition: all 0.15s; }
.sidebar-add-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(26,86,219,0.2); }
.post-add-btn { transition: all 0.15s; }
.post-add-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(26,86,219,0.2); }
.ptab:hover:not(.active) { color: var(--accent); background: rgba(26,86,219,0.04); }
.dbar-tab:hover:not(.active) { color: var(--accent); background: rgba(26,86,219,0.04); }
.btn-confirm:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(26,86,219,0.3); }
.btn-confirm:active { transform: translateY(0); }
.pc-img-btn:hover { background: rgba(26,86,219,0.12) !important; color: var(--accent); }

</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay hidden" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">連線資料庫...</div>
</div>

<!-- APP -->
<div id="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-wordmark">CALL <span>SHEET</span></span>
      <span class="topbar-context">拍攝通告單 2026 · DIGITIMES</span>
    </div>
    <div class="topbar-right">
      <span class="sync-badge" id="sync-badge">● 同步中</span> <button onclick="refreshData()" style="background:rgba(255,255,255,0.12);border:none;border-radius:6px;color:#fff;padding:5px 12px;font-size:12px;cursor:pointer;" title="重新載入最新資料">🔄 刷新</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-dates-row">
        <div class="date-bar" id="date-bar"></div>
        <button class="sidebar-date-add" onclick="openModal('modal-date')" title="新增拍攝日期">＋</button>
      </div>
      <div class="sidebar-header">
        <span class="sidebar-title">拍攝時程</span>
        <button class="sidebar-add-btn" onclick="openModal('modal-vendor')">＋ 新增</button>
      </div>
      <div class="sidebar-list" id="sidebar-list"></div>
    </div>

    <!-- PANEL -->
    <div class="panel" id="panel">
      <div class="panel-empty" id="panel-empty">
        <div class="panel-empty-icon">📋</div>
        <div class="panel-empty-text">從左側選擇廠商查看詳細資訊</div>
      </div>
      <div id="panel-content" style="display:none;">
        <div class="panel-hero">
          <div class="ph-time" id="ph-time"></div>
          <div class="ph-name" id="ph-name"></div>
          <div class="ph-meta" id="ph-meta"></div>
          <div class="ph-crew" id="ph-crew"></div>
        </div>
        <div class="panel-tabs">
          <button class="ptab active" onclick="switchPTab('info')">📋 資訊</button>
          <button class="ptab" onclick="switchPTab('highlights')">⭐ 展出亮點</button>
          <button class="ptab" onclick="switchPTab('products')">🖼 產品字卡</button>
          <button class="ptab" onclick="switchPTab('qa')">📝 訪綱</button>
          <button class="ptab" onclick="switchPTab('post')">🎬 後製</button>
        </div>
        <div class="panel-body">
          <div id="ptab-info"></div>
          <div id="ptab-highlights" style="display:none;"></div>
          <div id="ptab-products" style="display:none;"></div>
          <div id="ptab-qa" style="display:none;"></div>
          <div id="ptab-post" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: 新增日期 -->
<div class="modal-backdrop" id="modal-date">
  <div class="modal">
    <div class="modal-title">新增拍攝日期</div>
    <label>日期</label>
    <input type="date" id="input-date">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modal-date')">取消</button>
      <button class="btn-confirm" onclick="confirmAddDate()">新增</button>
    </div>
  </div>
</div>

<!-- MODAL: 新增廠商 -->
<div class="modal-backdrop" id="modal-vendor">
  <div class="modal">
    <div class="modal-title">新增拍攝項目</div>
    <label>廠商名稱</label>
    <input type="text" id="v-name" placeholder="例：技嘉科技">
    <div class="modal-row">
      <div><label>開始時間</label><input type="time" id="v-start"></div>
      <div><label>結束時間</label><input type="time" id="v-end"></div>
    </div>
    <label>攤位</label>
    <input type="text" id="v-booth" placeholder="例：南港一館一樓 K0802">
    <label>受訪者</label>
    <input type="text" id="v-interviewee" placeholder="例：許維哲｜產品行銷經理">
    <label>負責業務</label>
    <input type="text" id="v-am" placeholder="例：Iris">
    <label>拍攝類型</label>
    <div class="chip-row">
      <button class="chip selected" id="chip-interview" onclick="toggleChip('interview')">訪談</button>
      <button class="chip" id="chip-exclusive" onclick="toggleChip('exclusive')">專訪</button>
      <button class="chip" id="chip-reel" onclick="toggleChip('reel')">短影音</button>
    </div>
    <label>拍攝團隊（同一天可不同組）</label>
    <div class="modal-row">
      <div><input type="text" id="v-host" placeholder="🎤 HOST"></div>
      <div><input type="text" id="v-post" placeholder="🎬 後製人員"></div>
    </div>
    <div class="modal-row" style="margin-top:8px;">
      <div style="flex:1;"><input type="text" id="v-cameras" placeholder="🎥 攝影（多位請用逗號分隔，例：Toby, 阿達）"></div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modal-vendor')">取消</button>
      <button class="btn-confirm" onclick="confirmAddVendor()">新增</button>
    </div>
  </div>
</div>

<!-- MODAL: 新增產品字卡 -->
<div class="modal-backdrop" id="modal-product">
  <div class="modal">
    <div class="modal-title">新增產品字卡</div>
    <label>字卡標題</label>
    <input type="text" id="p-label" placeholder="例：產品字卡 01">
    <label>內容文字</label>
    <textarea id="p-text" placeholder="輸入產品說明文字..."></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modal-product')">取消</button>
      <button class="btn-confirm" onclick="confirmAddProduct()">新增</button>
    </div>
  </div>
</div>

<!-- MODAL: 新增訪綱 -->
<div class="modal-backdrop" id="modal-qa">
  <div class="modal">

// ── LOADING ──
function showLoading(t) { document.getElementById('loading').classList.remove('hidden'); document.getElementById('loading-text').textContent = t||'載入中...'; }
function hideLoading() { document.getElementById('loading').classList.add('hidden'); }

// ── INIT ──
async function initApp() {
  showLoading('連線資料庫...');
  await loadData();
  hideLoading();
  document.getElementById('app').classList.add('active');
  renderAll();
}

async function loadData() {
  const ref = doc(db, 'expo-shooting', 'main');
  const snap = await getDoc(ref);
  if (snap.exists()) {
    const data = snap.data();
    const isOldData = !data.version || data.version < 2;
    if (isOldData) {
      await seedCiscoData();
      return;
    }
    dates = data.dates || [];
    vendors = data.vendors || {};
    currentQrUrl = data.qrUrl || '';
  } else {
    await seedCiscoData();
    return;
  }
  if (!currentDateId || !dates.find(d => d.id === currentDateId)) {
    currentDateId = dates[0]?.id || null;
  }
  setSyncBadge('synced');
}

async function seedCiscoData() {
  dates = [{ id: 'd0', label: '7/7 (一)', host: '林思妤', camera1: 'Toby', camera2: '', post: '' }];
  vendors = { d0: CISCO_VENDORS };
  currentQrUrl = '';
  await setDoc(doc(db, 'expo-shooting', 'main'), { dates, vendors, qrUrl: '', version: 2 });
  if (!currentDateId) currentDateId = 'd0';
  setSyncBadge('synced');
}

window.refreshData = async function() {
  showLoading('重新載入...');
  const prev = currentVendorId;
  await loadData();
  hideLoading();
  renderAll();
  if (prev) { currentVendorId = prev; renderPanel(); }
};


let _saveTimer = null;
function saveData(immediate = false) {
  setSyncBadge('syncing');
  clearTimeout(_saveTimer);
  if (immediate) {
    return _doSave();
  } else {
    _saveTimer = setTimeout(_doSave, 1500);
    return Promise.resolve();
  }
}
async function _doSave() {
  await setDoc(doc(db, 'expo-shooting', 'main'), { dates, vendors, qrUrl: currentQrUrl, version: 2 });
  setSyncBadge('synced');
}
function setSyncBadge(s) {
  const el = document.getElementById('sync-badge');
  if (s === 'syncing') { el.textContent = '● 同步中'; el.className = 'sync-badge syncing'; }
  else { el.textContent = '● 已同步'; el.className = 'sync-badge'; }
}

// ── CLOUDINARY ──
async function uploadToCloudinary(file) {
  const fd = new FormData();
  fd.append('file', file); fd.append('upload_preset', UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
  const data = await res.json();
  return data.secure_url;
}

// ── RENDER ──
function renderAll() {
  renderDateBar();
  renderSidebar();
}

function renderDateBar() {
  const bar = document.getElementById('date-bar');
  bar.innerHTML = '';
  dates.forEach(d => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;';
    const tab = document.createElement('button');
    tab.className = 'dbar-tab' + (d.id === currentDateId ? ' active' : '');
    tab.textContent = d.label;
    tab.onclick = () => { currentDateId = d.id; currentVendorId = null; renderAll(); clearPanel(); };
    wrap.appendChild(tab);
    if (d.id === currentDateId && dates.length > 1) {
      const del = document.createElement('button');
      del.className = 'dbar-del'; del.textContent = '✕';
      del.onclick = () => { if (confirm(`確定刪除「${d.label}」所有資料？`)) { dates = dates.filter(x => x.id !== d.id); delete vendors[d.id]; currentDateId = dates[0]?.id||null; currentVendorId=null; saveData(true); clearPanel(); }};
      wrap.appendChild(del);
    }
    bar.appendChild(wrap);
  });
}

function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  list.innerHTML = '';
  const vlist = vendors[currentDateId] || [];
  if (!vlist.length) {
    list.innerHTML = '<div class="s-empty">📭 尚無拍攝項目<br>點右上方＋新增</div>';
    return;
  }
  vlist.forEach(v => {
    const card = document.createElement('div');
    card.className = 's-card' + (v.id === currentVendorId ? ' active' : '');
    card.innerHTML = `
      <div class="s-time"><div class="s-time-start">${v.start}</div><div class="s-time-end">${v.end}</div></div>
      <div class="s-info">
        <div class="s-name">${v.shortname}</div>
        <div class="s-sub">${v.booth||''}${v.am ? ' ｜ '+v.am : ''}</div>
        <div class="s-badges">
          ${v.interview!==false ? '<span class="badge badge-interview">訪談</span>' : ''}
          ${v.exclusive ? '<span class="badge badge-exclusive">專訪</span>' : ''}
          ${v.reel ? '<span class="badge badge-reel">短影音</span>' : ''}
        </div>
      </div>
      <button class="s-del-btn" onclick="event.stopPropagation();deleteVendor('${v.id}')" title="刪除">🗑</button>`;
    card.onclick = () => { currentVendorId = v.id; renderAll(); renderPanel(); };
    list.appendChild(card);
  });
}

function clearPanel() {
  document.getElementById('panel-empty').style.display = 'flex';
  document.getElementById('panel-content').style.display = 'none';
  currentVendorId = null;
  renderAll();
}

function getVendor() {
  return (vendors[currentDateId]||[]).find(x => x.id === currentVendorId);
}

window.updateVendorField = function(field, value) {
  const v = getVendor(); if (!v) return;
  v[field] = value;
  if (field === 'shortname') renderSidebar();
  if (field === 'start' || field === 'end') {
    vendors[currentDateId].sort((a,b)=>a.start.localeCompare(b.start));
    renderSidebar();
  }
  if (['interview','exclusive','reel'].includes(field)) {
    renderSidebar();
    renderPanel();
  }
  // Sync hero meta inputs without full re-render (prevents cursor jump)
  if (field === 'am') {
    const el = document.getElementById('meta-am');
    if (el && el !== document.activeElement) el.value = value;
  }
  if (field === 'interviewee') {
    const el = document.getElementById('meta-interviewee');
    if (el && el !== document.activeElement) el.value = value;
  }
  // Also re-render info tab to sync
  if (['booth','interviewee','am','notes'].includes(field)) {
    renderPTabInfo(v);
  }
  saveData();
};

        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
        onblur="updateQA(${qi},this.value);this.style.borderBottomColor='transparent';this.style.background='transparent';this.style.padding='0'"
        style="flex:1;border:none;background:transparent;font-family:inherit;color:var(--text);outline:none;resize:none;line-height:1.7;font-size:15px;border-bottom:1.5px dashed transparent;transition:border-color 0.15s;overflow:hidden;min-height:0;"
        onmouseover="this.style.borderBottomColor='#aaa'"
        onmouseout="if(document.activeElement!==this)this.style.borderBottomColor='transparent'"
        onfocus="this.style.borderBottomColor='#0d1b2a';this.style.background='#f0f4ff';this.style.borderRadius='4px';this.style.padding='4px 6px'">${q}</textarea>
      <button class="pc-qa-del" onclick="deleteQA(${qi})">✕</button>
    </div>`;
  });
  html += `</div><br><button class="pc-add-btn" onclick="document.getElementById('qa-text').value='';openModal('modal-qa')">＋ 新增訪問題目</button>`;
  document.getElementById('ptab-qa').innerHTML = html;
  // Auto-resize all textareas after render
  document.querySelectorAll('#ptab-qa textarea').forEach(ta => {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  });
}
window.confirmAddQA = async function() {
  const v=getVendor(); if(!v)return;
  const text=document.getElementById('qa-text').value.trim(); if(!text)return;
  if(!v.qa)v.qa=[];
  v.qa.push(text); closeModal('modal-qa'); await saveData(true); renderPTabQA(v);
};

// ── POST PRODUCTION TAB ──
function renderPTabPost(v) {
  const products = v.products || [];
  if (!products.length) {
    document.getElementById('ptab-post').innerHTML =
      '<div class="panel-body"><div style="text-align:center;padding:48px;color:#ccc;">請先在「產品字卡」Tab 新增字卡</div></div>';
    return;
  }
  let html = '<div class="panel-body" style="max-width:1120px;">';

  products.forEach((p, pi) => {
    const shots = p.shots || [];
    const hasShots = shots.length > 0;
    const hasPhoto = !!p.photo;
    const hasContent = hasShots || hasPhoto;
    html += `<div style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.07);margin-bottom:16px;">
      <div class="post-card-header-row">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">
          <span style="font-size:11px;font-weight:600;color:#888;letter-spacing:0.08em;flex-shrink:0;">${p.label||'字卡 '+pi}</span>
          ${p.img
            ? `<img src="${p.img}" class="post-card-mini-thumb" onclick="window.open('${p.img}','_blank')" title="字卡圖片">`
            : `<span class="post-card-mini-thumb post-card-mini-empty" title="尚未上傳字卡圖片">🖼</span>`}
          <div class="post-card-textcol" title="${(p.text||'').replace(/"/g,'&quot;')}">${p.text ? p.text.replace(/\n/g,'　') : '<span class="post-card-textcol-empty">尚未填寫產品說明文字</span>'}</div>
          <span style="font-size:10px;padding:2px 8px;border-radius:99px;flex-shrink:0;background:${hasShots?'#e0f5ec':'#fef0d8'};color:${hasShots?'#0a6640':'#7a4a00'};">
            ${hasShots ? shots.length+'張截圖' : '尚無素材'}
          </span>
        </div>
        <button class="post-add-btn" onclick="triggerShotUpload(${pi})">＋ 新增截圖</button>
        <input type="file" accept="image/*" multiple id="shot-input-${pi}" style="display:none" onchange="handleShotUpload(event,${pi})">
      </div>
      <div class="post-section">`;

    if (!hasContent) {
      html += `<div class="post-empty drop-zone" id="shot-drop-${pi}"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="handleShotDrop(event,${pi})"
        onclick="triggerShotUpload(${pi})">
        🎬 拖曳截圖至此，或點擊上傳<br>
        <span style="font-size:10px;color:#ccc;margin-top:4px;display:block;">支援多張同時上傳</span>
      </div>`;
    } else {
      html += `<div class="post-shots-grid" id="shot-grid-${pi}"
        ondragover="event.preventDefault()"
        ondrop="handleShotDrop(event,${pi})">`;
      // Pin 展品實拍照 as the first, highlighted hero tile — this IS the primary reference image
      if (hasPhoto) {
        html += `<div class="post-shot post-shot-hero">
          <div class="post-shot-img-wrap">
            <img class="post-shot-img" src="${p.photo}" onclick="window.open('${p.photo}','_blank')" title="展品實拍照">
            <div class="post-shot-hero-tag">📷 展品實拍照${p.photoFileNo ? ` · 檔號 ${p.photoFileNo}` : ''}</div>
          </div>
        </div>`;
      }
      shots.forEach((s, si) => {
        const isPhoto = p.photo === s.url;
        html += `<div class="post-shot">
          <div class="post-shot-img-wrap">
            <img class="post-shot-img" src="${s.url}" onclick="window.open('${s.url}','_blank')" title="點擊放大">
            <button class="post-shot-usebtn${isPhoto?' is-set':''}" onclick="setAsProductPhoto(${pi},${si})">${isPhoto?'✓ 已設為展品照':'設為展品照'}</button>
          </div>
          <div class="post-shot-fileno-row">
            <label>檔號</label>
            <input class="post-shot-filename" value="${s.filename||''}" placeholder="例：ACAM456"
              onchange="updateShot(${pi},${si},'filename',this.value)">
            <button class="post-shot-del" onclick="deleteShot(${pi},${si})">✕</button>
          </div>
        </div>`;
      });
      // Add new slot
      html += `<div class="post-shot-drop drop-zone" id="shot-drop-${pi}"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="handleShotDrop(event,${pi})"
        onclick="triggerShotUpload(${pi})">＋ 新增</div>`;
      html += `</div>`;
    }

    html += `</div></div>`;
  });

  html += '</div>';
  document.getElementById('ptab-post').innerHTML = html;
}

window.triggerShotUpload = function(pi) {
  document.getElementById('shot-input-'+pi)?.click();
};

window.handleShotUpload = async function(e, pi) {
  const files = [...e.target.files]; if(!files.length) return;
  showLoading('上傳截圖...');
  try {
    const v = getVendor(); if(!v) return;
    if(!v.products[pi].shots) v.products[pi].shots = [];
    for (const file of files) {
      const url = await uploadToCloudinary(file);
      v.products[pi].shots.push({ url, filename: file.name.replace(/\.[^.]+$/, '') });
    }
    await saveData(true);
    renderPTabPost(v);
    renderPTabProducts(v); // keep product card shot count in sync
  } catch(err) { alert('上傳失敗：' + err.message); }
  hideLoading();
};

window.handleShotDrop = async function(e, pi) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('shot-drop-'+pi)?.classList.remove('drag-over');
  const files = [...(e.dataTransfer.files||[])].filter(f=>f.type.startsWith('image/'));
  if(!files.length) return;
  showLoading('上傳截圖...');
  try {
    const v = getVendor(); if(!v) return;
    if(!v.products[pi].shots) v.products[pi].shots = [];
    for (const file of files) {
      const url = await uploadToCloudinary(file);
      v.products[pi].shots.push({ url, filename: file.name.replace(/\.[^.]+$/, '') });
    }
    await saveData(true);
    renderPTabPost(v);
    renderPTabProducts(v); // keep product card shot count in sync
  } catch(err) { alert('上傳失敗：' + err.message); }
  hideLoading();
};

window.updateShot = function(pi, si, field, value) {
  const v = getVendor(); if(!v) return;
  const shot = v.products[pi].shots[si]; if(!shot) return;
  shot[field] = value;
  if (field === 'filename' && v.products[pi].photo === shot.url) {
    v.products[pi].photoFileNo = value;
  }
  saveData();
};

window.deleteShot = async function(pi, si) {
  const v = getVendor(); if(!v) return;
  const shot = v.products[pi].shots[si];
  if (shot && v.products[pi].photo === shot.url) {
    v.products[pi].photo = '';
    v.products[pi].photoFileNo = '';
  }
  v.products[pi].shots.splice(si, 1);
  await saveData(true);
  renderPTabPost(v);
  renderPTabProducts(v); // sync shot count on product card
};
window.deleteQA = async function(qi) {
  const v=getVendor(); if(!v)return; v.qa.splice(qi,1); await saveData(true); renderPTabQA(v);
};
window.handleQARefUpload = async function(e) {
  const file = e.target.files[0]; if (!file) return;
  const v = getVendor(); if (!v) return;
  const uploading = document.getElementById('qa-ref-uploading');
  if (uploading) uploading.style.display = 'block';
  try {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', 'DTstudio');
    const res = await fetch('https://api.cloudinary.com/v1_1/dz7ark1gs/auto/upload', { method: 'POST', body: fd });
    const data = await res.json();
    const url = data.secure_url;
    v.qaRef = url;
    // Update input display
    const input = document.getElementById('qa-ref-input');
    if (input) input.value = url;
    await saveData(true);
    renderPTabQA(v);
  } catch(err) { alert('上傳失敗：' + err.message); }
  if (uploading) uploading.style.display = 'none';
};

window.updateQA = async function(qi, value) {
  const v=getVendor(); if(!v||v.qa[qi]===undefined)return;
  v.qa[qi]=value;
  await saveData(true); // immediate save, not debounced
};

// ── ADD DATE ──
window.confirmAddDate = async function() {
  const val=document.getElementById('input-date').value; if(!val)return;
  const [y,m,d]=val.split('-').map(Number);
  const days=['日','一','二','三','四','五','六'];
  const dow=new Date(y,m-1,d).getDay();
  const label=`${m}/${d} (${days[dow]})`;
  const id='d'+Date.now();
  dates.push({id,label}); vendors[id]=[];
  currentDateId=id; currentVendorId=null;
  closeModal('modal-date'); await saveData(true); clearPanel();
};

// ── ADD VENDOR ──
let chipState2 = { interview:true, exclusive:false, reel:false };
window.toggleChip = function(name) {
  chipState2[name]=!chipState2[name];
  document.getElementById('chip-'+name).classList.toggle('selected',chipState2[name]);
};
window.openModal = function(id) {
  if(id==='modal-vendor'){
    chipState2={interview:true,exclusive:false,reel:false};
    document.getElementById('chip-interview').classList.add('selected');
    document.getElementById('chip-exclusive').classList.remove('selected');
    document.getElementById('chip-reel').classList.remove('selected');
    ['v-name','v-booth','v-interviewee','v-am','v-host','v-cameras','v-post'].forEach(x=>document.getElementById(x).value='');
    document.getElementById('v-start').value=''; document.getElementById('v-end').value='';
  }
  document.getElementById(id).classList.add('open');
};
window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };
document.querySelectorAll('.modal-backdrop').forEach(el=>{
  el.addEventListener('click',function(e){ if(e.target===this)this.classList.remove('open'); });
});
window.confirmAddVendor = async function() {
  const name=document.getElementById('v-name').value.trim(); if(!name)return;
  const cameraNames = document.getElementById('v-cameras').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
  const v={
    id:'v'+Date.now(), shortname:name, company:name,
    start:document.getElementById('v-start').value||'00:00',
    end:document.getElementById('v-end').value||'00:00',
    booth:document.getElementById('v-booth').value.trim(),
    interviewee:document.getElementById('v-interviewee').value.trim(),
    am:document.getElementById('v-am').value.trim(),
    host:document.getElementById('v-host').value.trim(),
    cameraNames:cameraNames,
    post:document.getElementById('v-post').value.trim(),
    exclusive:chipState2.exclusive||false,
    reel:chipState2.reel, products:[], qa:[]
  };
  if(!vendors[currentDateId])vendors[currentDateId]=[];
  vendors[currentDateId].push(v);
  vendors[currentDateId].sort((a,b)=>a.start.localeCompare(b.start));
  closeModal('modal-vendor'); await saveData(true);
};

// Init default ptab
switchPTab('info');

// ── DELETE VENDOR ──
window.deleteVendor = async function(vendorId) {
  const v = (vendors[currentDateId]||[]).find(x => x.id === vendorId);
  if (!v) return;
  if (!confirm(`確定要刪除「${v.shortname}」？\n此操作無法復原。`)) return;
  vendors[currentDateId] = vendors[currentDateId].filter(x => x.id !== vendorId);
  if (currentVendorId === vendorId) clearPanel();
  await saveData(true);
  renderSidebar();
};

// ── GLOBAL PASTE (Ctrl+V) for images ──
document.addEventListener('paste', async function(e) {
  const items = [...(e.clipboardData?.items || [])];
  const imgItem = items.find(i => i.type.startsWith('image/'));
  if (!imgItem) return;
  const file = imgItem.getAsFile();
  if (!file) return;

  // Check which zone is "active" / hovered — try floorplan first, then products
  const floorZone = document.getElementById('floorplan-drop');
  const productZones = document.querySelectorAll('[id^="pzone-"]');

  // Find which zone was last interacted with
  const activeZone = document.querySelector('.drop-zone:hover') ||
                     document.querySelector('.pc-floorplan-drop') ||
                     null;

  if (!activeZone) return;

  if (activeZone.id === 'floorplan-drop' || activeZone.closest('#floorplan-drop')) {
    showLoading('上傳平面圖...');
    try {
      const url = await uploadToCloudinary(file);
      const v = getVendor(); if (!v) return;
      v.floorplan = url; await saveData(true); renderPTabInfo(v);
    } catch { alert('上傳失敗'); }
    hideLoading();
  } else {
    const pzone = activeZone.closest('[id^="pzone-"]') || activeZone;
    if (pzone && pzone.id && pzone.id.startsWith('pzone-card-')) {
      const pi = parseInt(pzone.id.replace('pzone-card-', ''));
      showLoading('上傳字卡圖片...');
      try {
        const url = await uploadToCloudinary(file);
        const v = getVendor(); if (!v) return;
        v.products[pi].img = url; await saveData(true); renderPTabProducts(v);
      } catch { alert('上傳失敗'); }
      hideLoading();
    } else if (pzone && pzone.id && pzone.id.startsWith('pzone-photo-')) {
      const pi = parseInt(pzone.id.replace('pzone-photo-', ''));
      showLoading('上傳展品照...');
      try {
        const url = await uploadToCloudinary(file);
        const v = getVendor(); if (!v) return;
        v.products[pi].photo = url; v.products[pi].photoFileNo = ''; await saveData(true); renderPTabProducts(v);
      } catch { alert('上傳失敗'); }
      hideLoading();
    }
  }
});

// ── DRAG ENTER visual on body (show global drag state) ──
let _dragCounter = 0;
document.addEventListener('dragenter', () => { _dragCounter++; });
document.addEventListener('dragleave', () => { _dragCounter--; });
document.addEventListener('drop', () => { _dragCounter = 0; });
